services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movau}
      POSTGRES_DB: ${POSTGRES_DB:-movau}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movau} -d ${POSTGRES_DB:-movau}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ./backend
      args:
        PROJECT: src/Movau.Api/Movau.Api.csproj
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-movau}:${POSTGRES_PASSWORD:-movau}@db:5432/${POSTGRES_DB:-movau}
      REDIS_URL: redis://redis:6379/0
      ASPNETCORE_URLS: http://0.0.0.0:8001
      EMBED_REALTIME: "false"
    expose:
      - "8001"
    volumes:
      - ./backend:/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s

  realtime:
    build:
      context: ./backend
      args:
        PROJECT: src/Movau.Realtime/Movau.Realtime.csproj
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-movau}:${POSTGRES_PASSWORD:-movau}@db:5432/${POSTGRES_DB:-movau}
      REDIS_URL: redis://redis:6379/0
      ASPNETCORE_URLS: http://0.0.0.0:8002
    expose:
      - "8002"
    volumes:
      - ./backend:/src
    depends_on:
      core:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    build:
      context: ./backend
      args:
        PROJECT: src/Movau.Gateway/Movau.Gateway.csproj
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8000
      CORE_URL: http://core:8001
      REALTIME_URL: http://realtime:8002
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/src
    depends_on:
      core:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - gateway

volumes:
  pgdata:
  web_node_modules:
